name: Postgres pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements/pipeline.txt
      - run: python scripts/setup_pipeline.py
      - name: Start source Postgres
        run: docker compose --env-file .env -p p045-b -f infra/postgres/compose.yml up -d --build --wait
      - name: Lint
        run: ruff check src/pipeline src/run_report src/agents src/codegen pipeline_tests scripts/setup_pipeline.py scripts/seed_pipeline.py scripts/seed_run_reports.py
      - name: Test backend and real Postgres
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
        run: |
          python - <<'PY'
          import os
          import pytest
          from src.pipeline.settings import PipelineSettings
          os.environ['PIPELINE_TEST_DATABASE_URL'] = PipelineSettings().database_url.get_secret_value()
          raise SystemExit(pytest.main(['tests', 'pipeline_tests', '-q', '--tb=short']))
          PY
      - name: Stop source Postgres
        if: always()
        run: docker compose --env-file .env -p p045-b -f infra/postgres/compose.yml down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
