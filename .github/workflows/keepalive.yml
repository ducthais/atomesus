# Space miễn phí ngủ sau 48 giờ không có request, lịch Dagster dừng theo. Gọi /health mỗi 12 giờ để Space luôn thức.
# Không có secret HF_SPACE (chưa dùng combo miễn phí, docs/deploy-free.md) thì không làm gì.
name: Keep Space awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          [ -n "$HF_SPACE" ] || { echo "::notice::Chưa có secret HF_SPACE, bỏ qua."; exit 0; }
          host="https://$(echo "$HF_SPACE" | tr 'A-Z/_.' 'a-z---').hf.space"
          curl -fsS --retry 6 --retry-delay 30 --retry-all-errors --max-time 60 "$host/health"
