# Domain, nguồn và thực thể (SPEC §8.4). Steward sở hữu file này; sửa qua pull request.
user_defaults:
  currency:
    base: VND
    rates: { VND: 1, USD: 25400 }
domains:
  sales:
    hidden: true                      # ẩn khỏi luồng thao tác mới; run cũ và pipeline đã deploy vẫn đọc được
    datasets: [sales_raw]
    steward: an@company.vn
    currency:                         # dùng cho staging.columns[].currency
      base: VND
      rates: { VND: 1, USD: 25400 }   # tỷ giá cố định, steward cập nhật
    sources:                          # mọi nguồn domain này được phép đọc
      sales_pg:      { kind: postgres,   connection_ref: sandbox_pg,    schema: sales_raw }
      sales_api:     { kind: rest_api,   connection_ref: mock_api,      openapi: /sales/openapi.json }
      landing_sales: { kind: filesystem, connection_ref: landing_sales, root: infra/landing/sales }
    entities:
      customer:
        canonical: false
        definition: "tài khoản đã ký hợp đồng"
        tables: [sales_pg.customers, sales_pg.accounts]
        aliases: [khách hàng, khách]
      order:
        canonical: true
        definition: "đơn hàng đã xác nhận"
        tables: [sales_pg.orders]
      payment:
        canonical: true
        definition: "khoản thanh toán đã ghi nhận cho một đơn hàng"
        tables: [sales_api.payments]
      refund:
        canonical: true
        definition: "khoản hoàn tiền đã duyệt"
        tables: [landing_sales.refunds]
  marketing:
    datasets: [mkt_raw]
    steward: binh@company.vn
    currency:
      base: VND
      rates: { VND: 1, USD: 25400 }
    sources:
      mkt_api: { kind: rest_api, connection_ref: mock_api, openapi: /marketing/openapi.json }
    entities:
      customer:
        canonical: false
        definition: "người để lại email"
        tables: [mkt_api.leads, mkt_api.contacts]
        aliases: [khách hàng, khách, lead]
  rental:                             # Pagila (bộ dữ liệu mẫu cho thuê DVD), schema pagila trong cùng Postgres
    datasets: [pagila]
    steward: steward@company.vn       # TODO: đổi thành steward thật của domain
    currency:
      base: USD                       # Pagila ghi tiền thuê bằng USD
      rates: { USD: 1 }
    sources:
      pagila_pg:  { kind: postgres, connection_ref: sandbox_pg, schema: pagila }
      review_api: { kind: rest_api, connection_ref: mock_api,   openapi: /reviews/openapi.json }  # khóa chung rental_id, customer_id, film_id
    entities:
      film:
        canonical: true
        definition: "phim trong danh mục cho thuê"
        tables: [pagila_pg.film]
      inventory:
        canonical: true
        definition: "một bản DVD vật lý của một phim, thuộc một cửa hàng"
        tables: [pagila_pg.inventory]
      rental:
        canonical: true
        definition: "một lượt khách thuê một bản DVD, từ lúc thuê đến lúc trả"
        tables: [pagila_pg.rental]
      payment:
        canonical: false
        definition: "khoản khách trả cho một lượt thuê (USD)"
        tables: [pagila_pg.payment]
      customer:
        canonical: false
        definition: "khách có tài khoản thuê DVD tại một cửa hàng"
        tables: [pagila_pg.customer]
        aliases: [khách hàng, khách]
      store:
        canonical: true
        definition: "cửa hàng cho thuê DVD"
        tables: [pagila_pg.store]
      review:
        canonical: true
        definition: "phản hồi khách gửi sau khi trả một lượt thuê (điểm 1–5, có giới thiệu cho người khác không)"
        tables: [review_api.feedback]
        aliases: [đánh giá, phản hồi]
  bench:                              # bộ sự kiện lớn cho eval optimizer, sinh lúc chạy (eval/bench/make_events.py)
    datasets: [bench]
    steward: steward@company.vn       # TODO: đổi thành steward thật của domain
    currency:
      base: VND
      rates: { VND: 1 }
    sources:                          # thư mục chưa sinh thì nguồn hiện `available: false`, domain khác không ảnh hưởng
      landing_bench: { kind: filesystem, connection_ref: landing_bench, root: infra/landing/bench }
    entities:
      event:
        canonical: true
        definition: "một sự kiện phát sinh tiền của một người dùng trong một ngày (VND)"
        tables: [landing_bench.events]
        aliases: [sự kiện]

conformed_dimensions: []   # rỗng nghĩa là chưa có thực thể nào được công nhận dùng chung
