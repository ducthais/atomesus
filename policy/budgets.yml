# Trần chi phí và số lần thử (SPEC §8.4). Mọi trần trong code đọc từ đây, không hardcode (NFR-04).
pricing:
  usd_per_tb: 5.0           # đơn giá Azure Synapse serverless SQL (USD / TB dữ liệu xử lý); DuckDB quy đổi theo số này
  llm:                      # USD cho 1 triệu token theo bảng giá OpenAI; model không có ở đây thì không tính được tiền
    gpt-4o-mini: { input_usd_per_mtok: 0.15, output_usd_per_mtok: 0.60 }
    gpt-4o:      { input_usd_per_mtok: 2.50, output_usd_per_mtok: 10.00 }
per_run:
  max_bytes_scanned: 5_000_000_000
  max_usd: 0.05
  max_llm_calls: 6          # trần toàn cục 1 run; router VÀ UI đều đọc từ đây
  max_chat_calls: 20        # trần câu hỏi `ask` trong chat cho 1 run, tách khỏi max_llm_calls
  max_spec_attempts: 2      # vòng spec
  max_sql_attempts: 2       # vòng SQL
  phase_timeout_sec: 300    # một phase chạy quá thời gian này thì dừng (NFR-05)
per_day:
  max_usd: 2.00             # tổng chi phí mọi run trong ngày (quét dữ liệu + LLM); cổng budget cộng dồn
  max_batch_runs: 20        # số pipeline tối đa trong một yêu cầu tạo theo lô
per_user:                   # trần của từng người dùng mỗi ngày UTC, áp cùng trần chung per_day (ADR-0001 D10)
  max_usd_per_day: 0.30     # chi phí (LLM + quét dữ liệu) các run của một người; run hệ thống tính cho chủ pipeline
  max_runs_per_day: 20      # số run mới một người tạo được trong ngày; hết lượt thì API trả 429. Admin không áp
optimizer:                  # P13 (SPEC §9.3): luật tối ưu tất định, không gọi LLM
  incremental_min_rows: 10000   # table_to_incremental chỉ thử khi bảng nguồn chính có ít nhất ngần này dòng
  rerun_samples: 5              # chạy lại model gold ngần này lần sau lần build đầu (trung vị; hai dải đo không chồng nhau)
  min_gain_pct: 10              # bản ứng viên phải nhanh hơn bản gốc ít nhất ngần này % mới được giữ
rules:
  - require_partition_filter_on: [sales_pg.orders]
  - forbid_select_star_in: [gold]
  - max_tables_joined: 6
