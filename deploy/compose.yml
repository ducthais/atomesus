# Toàn bộ Atomesus trên một máy (VM Oracle Cloud Always Free), xem docs/deploy.md.
#   docker compose --env-file .env -f deploy/compose.yml up -d --build
# Chỉ Caddy mở cổng ra ngoài (80/443, HTTPS tự động). Các dịch vụ khác nói chuyện qua mạng nội bộ của compose.
# Dữ liệu sống qua mỗi lần deploy: ../data (sổ bằng chứng, warehouse, lịch sử Dagster), volume pgdata, caddy,
# dagster_code (code location production) và deployer_state.
# Code location của Dagster production (volume dagster_code, mount ở /app/data/dagster_local) CHỈ service deployer
# ghi được (SPEC §9.5 bước 4, mục 19); dagster và backend mount chỉ đọc (read_only) và `nocopy` (không bao giờ chép nội
# dung image vào volume). Bật deployer: docs/deploy.md mục 6.
name: atomesus

x-build: &build
  context: ..
  dockerfile: Dockerfile

# Không đặt env_file ở đây (lỗi N1): chỉ backend đọc ../.env (OpenAI key, token GitHub, mật khẩu…). Dagster và mock
# API chỉ nhận đúng biến mình cần, khai báo ở `environment` của từng service.
x-app: &app
  build: *build
  image: atomesus-app
  restart: unless-stopped

services:
  postgres:
    build: ../infra/postgres
    image: atomesus-postgres
    environment:
      POSTGRES_DB: pipeline_demo
      POSTGRES_USER: pipeline_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PIPELINE_READER_PASSWORD: ${PIPELINE_READER_PASSWORD:?Set PIPELINE_READER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pipeline_admin -d pipeline_demo"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mock-api:
    <<: *app
    command: ["uvicorn", "infra.mock_api.app:app", "--host", "0.0.0.0", "--port", "8100"]
    # Dữ liệu cố định trong image, không cần biến môi trường nào, không mount data/.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/sales/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    <<: *app
    env_file: ../.env
    environment:
      # direct (mặc định): Deploy ghi bundle vào ../data/releases/inbox, deployer cài; pr: mở pull request (mục 6).
      PIPELINE_DEPLOY_MODE: ${PIPELINE_DEPLOY_MODE:-direct}
      PIPELINE_RELEASE_DIR: /app/data/releases
    volumes:
      # Gồm cả hộp thư release data/releases: backend chỉ ghi inbox/, không đụng done/ và rejected/
      - ../data:/app/data
      # Day 2 đọc pipeline đang chạy; không ghi được
      - { type: volume, source: dagster_code, target: /app/data/dagster_local, read_only: true, volume: { nocopy: true } }
    depends_on:
      postgres: { condition: service_healthy }
      mock-api: { condition: service_started }

  dagster:
    <<: *app
    command: ["python", "scripts/dagster_local.py"]
    # Không đọc ../.env (lỗi N1): không có OPENAI_API_KEY, PIPELINE_GITHUB_*, secret của deployer hay mật khẩu đăng
    # nhập. Chỉ các biến scripts/dagster_local.py cần để chạy pipeline và vòng Day 2 (collect, tất định). Tiến trình
    # Dagster con (code server, webserver, daemon) còn nhận ít hơn nữa: không có PIPELINE_CONNECTION_KEY hay credential
    # nguồn nào; supervisor ghi credential của từng pipeline vào tmpfs dưới đây (src/dagster_runtime/secrets.py).
    environment:
      APP_ENV: ${APP_ENV:-production}
      DAGSTER_HOST: 0.0.0.0
      DAGSTER_PORT: "3070"
      DAGSTER_CODE_READONLY: "1"
      ATOMESUS_SECRETS_DIR: /run/atomesus-secrets
      PIPELINE_CONNECTION_KEY: ${PIPELINE_CONNECTION_KEY:-}  # giải mã kết nối Postgres người dùng đã lưu
      PIPELINE_DATABASE_URL: ${PIPELINE_DATABASE_URL:?Set PIPELINE_DATABASE_URL}  # tài khoản chỉ đọc pipeline_reader
      PIPELINE_MOCK_API_URL: ${PIPELINE_MOCK_API_URL:-http://mock-api:8100}
      PIPELINE_WAREHOUSE_TIMEZONE: ${PIPELINE_WAREHOUSE_TIMEZONE:-UTC}
      PIPELINE_AZURE_STORAGE_CONNECTION_STRING: ${PIPELINE_AZURE_STORAGE_CONNECTION_STRING:-}  # ước tính chi phí
      PIPELINE_AZURE_STORAGE_CONTAINER: ${PIPELINE_AZURE_STORAGE_CONTAINER:-}
      DAGSTER_MAX_CONCURRENT_RUNS: ${DAGSTER_MAX_CONCURRENT_RUNS:-1}
    volumes:
      # Đọc-ghi: lịch sử Dagster, warehouse từng pipeline, và runs.sqlite3 (vòng Day 2 ghi số đo, cảnh báo).
      - ../data:/app/data
      # Chỉ deployer ghi; `.generation` đổi thì supervisor nạp lại code location hợp nhất qua GraphQL (không khởi động
      # lại Dagster, run đang chạy giữ nguyên). Kết quả dbt từng lần chạy ghi vào data/dagster_home/dbt_target
      # (scripts/dagster_local.py), không ghi vào code location.
      - { type: volume, source: dagster_code, target: /app/data/dagster_local, read_only: true, volume: { nocopy: true } }
    # Credential theo từng pipeline (<model>.json, 0600): chỉ nằm trong RAM, không ghi vào ../data hay volume nào.
    tmpfs:
      - /run/atomesus-secrets:mode=0700,uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3070/server_info')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_started }
      deployer: { condition: service_started }  # deployer tạo mốc .generation trong dagster_code

  # PIPELINE_DEPLOY_MODE=direct (mặc định): cài bundle backend ghi vào hộp thư release ../data/releases, không cần
  # git hay deploy key. pr: kéo nhánh mặc định của repo pipeline bằng deploy key CHỈ ĐỌC. Cả hai kiểm manifest, cài
  # vào dagster_code, báo backend (scripts/deployer.py). Không dùng ../.env: không có OpenAI key hay mật khẩu nguồn, chỉ các biến dưới đây. Luôn chạy;
  # chưa cấu hình (docs/deploy.md mục 6) thì chỉ ghi log nhắc và nằm chờ, Dagster chạy với danh sách pipeline rỗng.
  #
  # Image: image app của backend (cùng code, cùng thư viện, build trước) thêm git + openssh-client để fetch qua SSH.
  # Nó cũng mang sẵn /app/data/dagster_local (mốc .generation rỗng) và /app/state thuộc user `app`: volume Docker mới
  # tạo còn rỗng thì lần đầu mount vào deployer được chép nội dung và chủ sở hữu từ đây, nên deployer (không phải
  # root) ghi được mà không cần service nào khác ghi volume. Các service khác mount `nocopy` nên không chép gì vào.
  deployer:
    build:
      context: ..
      additional_contexts:
        app: service:backend
      dockerfile_inline: |
        FROM app
        USER root
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git openssh-client \
            && rm -rf /var/lib/apt/lists/* \
            && mkdir -p /app/data/dagster_local /app/state \
            && printf '' > /app/data/dagster_local/.generation \
            && chown -R app:app /app/data/dagster_local /app/state
        USER app
    image: atomesus-deployer
    command: ["python", "scripts/deployer.py"]
    environment:
      PIPELINE_DEPLOY_MODE: ${PIPELINE_DEPLOY_MODE:-direct}
      PIPELINE_RELEASE_DIR: /app/data/releases
      DEPLOYER_REPO_URL: ${DEPLOYER_REPO_URL:-}
      PIPELINE_DEPLOYER_SECRET: ${PIPELINE_DEPLOYER_SECRET:-}
      DEPLOYER_INTERVAL_SEC: ${DEPLOYER_INTERVAL_SEC:-60}
      DEPLOYER_DAGSTER_URL: ${DEPLOYER_DAGSTER_URL:-http://dagster:3070}
      DEPLOYER_VERIFY_TIMEOUT_SEC: ${DEPLOYER_VERIFY_TIMEOUT_SEC:-120}
      DEPLOYER_SSH_KEY: /run/secrets/deployer/deploy_key
      DEPLOYER_KNOWN_HOSTS: ${DEPLOYER_KNOWN_HOSTS:-/app/src/deployer/github_known_hosts}
      DEPLOYER_STATE_DIR: /app/state
      DEPLOYER_BACKEND_URL: http://backend:8000
      PIPELINE_DEPLOY_DIR: /app/data/dagster_local
      DO_NOT_TRACK: "1"
    # Thư mục khóa nằm ngoài ~/atomesus (rsync của workflow Deploy xóa file lạ trong đó) và ngoài ../data (backend đọc
    # được); mount cả thư mục, chỉ đọc, để chưa tạo khóa thì Docker không tạo nhầm thư mục ở chỗ tên file.
    volumes:
      - dagster_code:/app/data/dagster_local
      - deployer_state:/app/state
      # Hộp thư release (direct): đọc bundle trong inbox/, chuyển sang done/ hoặc rejected/ sau khi xử lý
      - ../data/releases:/app/data/releases
      - ${DEPLOYER_SSH_DIR:-/etc/atomesus-deployer}:/run/secrets/deployer:ro
    healthcheck:
      disable: true  # không phục vụ HTTP; HEALTHCHECK của image app (cổng 8000) không áp dụng
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        PIPELINE_BACKEND_URL: http://backend:8000
    image: atomesus-web
    environment:
      PIPELINE_BACKEND_URL: http://backend:8000
      PIPELINE_EGRESS_IP: ${PIPELINE_EGRESS_IP:-}
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      DAGSTER_DOMAIN: ${DAGSTER_DOMAIN:?Set DAGSTER_DOMAIN}
      DAGSTER_USER: ${DAGSTER_USER:-admin}
      DAGSTER_PASSWORD_HASH: ${DAGSTER_PASSWORD_HASH:?Set DAGSTER_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, dagster]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  dagster_code:
  deployer_state:
