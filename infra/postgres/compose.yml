services:
  postgres:
    build: .
    image: p045-pipeline-postgres:16
    environment:
      POSTGRES_DB: pipeline_demo
      POSTGRES_USER: pipeline_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PIPELINE_READER_PASSWORD: ${PIPELINE_READER_PASSWORD:?Set PIPELINE_READER_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pipeline_admin -d pipeline_demo"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
